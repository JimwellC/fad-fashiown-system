<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fad Fashiown</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-page">
    <div class="login-box">

        <!-- Logo -->
        <div class="login-logo">
            <div class="login-logo-name">✦ Fad <em>Fashiown</em></div>
            <div class="login-logo-sub">Live Selling System</div>
        </div>

        <!-- Card -->
        <div class="login-card">
            <h2>Welcome back</h2>
            <p>Sign in to your selling dashboard</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email"
                           class="form-input"
                           placeholder="your@email.com"
                           required autocomplete="email" />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password"
                           class="form-input"
                           placeholder="••••••••"
                           required autocomplete="current-password" />
                </div>

                <div class="remember-row">
                    <input type="checkbox" name="remember" id="remember" />
                    <label for="remember">Keep me signed in</label>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;padding:15px">
                    Sign In →
                </button>
            </form>
        </div>

        <div class="login-footer">
            New business? <a href="/register">Create an account</a>
        </div>

    </div>
</div>

</body>
</html>
