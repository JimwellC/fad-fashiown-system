<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fad Fashiown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #F5F0E8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #2D5A1B;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .logo h1 span {
            font-style: italic;
            color: #4A7C2F;
        }

        .logo p {
            font-size: 12px;
            color: #8A7E6E;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 36px;
            border: 1px solid #E8E0D0;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #1A1A1A;
            margin-bottom: 6px;
        }

        .card p {
            font-size: 13px;
            color: #8A7E6E;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #8A7E6E;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background: #FAFAF7;
            border: 1.5px solid #E0D8C8;
            border-radius: 8px;
            color: #1A1A1A;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2D5A1B;
            background: white;
        }

        .form-group input::placeholder {
            color: #C4B89A;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .remember-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2D5A1B;
        }

        .remember-row label {
            font-size: 13px;
            color: #5A5045;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: #2D5A1B;
            color: #F5F0E8;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: #3D7A25;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(45,90,27,0.25);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #8A7E6E;
        }

        .register-link a {
            color: #2D5A1B;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Flash messages */
        .flash {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .flash.error {
            background: #FFF0EC;
            color: #8B2500;
            border: 1px solid #FFCBB8;
        }

        .flash.success {
            background: #F0F7EE;
            color: #2D5A1B;
            border: 1px solid #C8E6C0;
        }
    </style>
</head>
<body>
    <div class="login-container">

        <!-- Logo -->
        <div class="logo">
            <h1>✦ Fad <span>Fashiown</span></h1>
            <p>Live Selling System</p>
        </div>

        <!-- Login Card -->
        <div class="card">
            <h2>Welcome back</h2>
            <p>Sign in to your selling dashboard</p>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Login Form -->
            <form method="POST" action="/login">
                <div class="form-group">
                    <label>Email Address</label>
                    <input
                        type="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    />
                </div>

                <div class="remember-row">
                    <input type="checkbox" name="remember" id="remember" />
                    <label for="remember">Keep me signed in</label>
                </div>

                <button type="submit" class="btn-login">
                    Sign In →
                </button>
            </form>
        </div>

        <div class="register-link">
            New business? <a href="/register">Create an account</a>
        </div>

    </div>
</body>
</html>
