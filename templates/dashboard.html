<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fad Fashiown - Live Selling</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ── HEADER ── -->
    <div class="header">
        <h1>✦ Fad <span>Fashiown</span></h1>
        <div class="status-bar">
            <span id="connection-status" class="status-dot disconnected">
                ⚪ Connecting...
            </span>
            <span id="detection-status" class="detection-badge off">
                🔴 Extension OFF
            </span>
        </div>
    </div>

    <!-- ── MAIN CONTENT ── -->
    <div class="main-container">

        <!-- LEFT PANEL -->
        <div class="left-panel">

            <!-- Current Buyer -->
            <div class="card buyer-card" id="buyer-card">
                <div class="card-label">
                    📌 Current Buyer
                </div>
                <div class="buyer-username" id="buyer-username">
                    Waiting for buyer...
                </div>
                <div class="buyer-time" id="buyer-time"></div>
            </div>

            <!-- Order Form -->
            <div class="card form-card">
                <div class="card-label">📝 Order Details</div>

                <div class="form-group">
                    <label for="item-name">Item Name / Code</label>
                    <input
                        type="text"
                        id="item-name"
                        placeholder="e.g. Dress #12, Blouse #4"
                        autocomplete="off"
                    />
                </div>

                <div class="form-group">
                    <label for="price">Price (₱)</label>
                    <input
                        type="number"
                        id="price"
                        placeholder="e.g. 350"
                        min="0"
                        step="0.01"
                    />
                </div>

                <div class="button-group">
                    <button class="btn btn-print" id="print-btn" onclick="printLabel()">
                        🖨️ &nbsp; Print Label
                    </button>
                    <button class="btn btn-clear" onclick="clearForm()">
                        Clear Form
                    </button>
                </div>

                <!-- Manual Override -->
                <div class="manual-section">
                    <div class="card-label" style="margin-bottom:10px">
                        ✋ Manual Override
                    </div>
                    <div class="manual-row">
                        <input
                            type="text"
                            id="manual-username"
                            placeholder="Type username manually"
                            autocomplete="off"
                        />
                        <button class="btn btn-manual" onclick="setManualBuyer()">
                            SET
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <!-- Live Comments -->
            <div class="card comments-card">
                <div class="card-label">
                    💬 Live Comments
                    <span id="comment-count"
                        style="background:#2D5A1B;
                               color:#F5F0E8;
                               padding:2px 10px;
                               border-radius:12px;
                               font-size:11px;
                               font-weight:700">
                        0
                    </span>
                </div>
                <div class="comments-hint">
                    🟢 Green border = "mine" comment — click any to set as buyer
                </div>
                <div id="comments-list">
                    <div class="empty-state">
                        Waiting for comments...<br>
                        <small>Make sure the extension is active on TikTok Live</small>
                    </div>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="card orders-card">
                <div class="card-label">
                    📦 Recent Orders
                    <button class="btn-refresh" onclick="loadOrders()">↺ Refresh</button>
                </div>
                <div id="orders-list">
                    <div class="empty-state">No orders yet</div>
                </div>
            </div>

        </div>

    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="/static/app.js"></script>

</body>
</html>
