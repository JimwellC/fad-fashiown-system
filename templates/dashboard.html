<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fad Fashiown - Live Selling</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ── HEADER ── -->
    <div class="header">
        <h1>👗 Fad Fashiown</h1>
        <div class="status-bar">
            <span id="connection-status" class="status-dot disconnected">⚪ Connecting...</span>
            <span id="detection-status" class="detection-badge off">🔴 Extension OFF</span>
        </div>
    </div>

    <!-- ── MAIN CONTENT ── -->
    <div class="main-container">

        <!-- LEFT PANEL -->
        <div class="left-panel">

            <!-- Current Buyer Card -->
            <div class="card buyer-card" id="buyer-card">
                <div class="card-label">📌 CURRENT BUYER</div>
                <div class="buyer-username" id="buyer-username">
                    Waiting for buyer...
                </div>
                <div class="buyer-time" id="buyer-time"></div>
            </div>

            <!-- Order Form -->
            <div class="card form-card">
                <div class="card-label">📝 ORDER DETAILS</div>

                <div class="form-group">
                    <label for="item-name">Item Name / Code</label>
                    <input
                        type="text"
                        id="item-name"
                        placeholder="e.g. Dress #12, Blouse #4"
                        autocomplete="off"
                    />
                </div>

                <div class="form-group">
                    <label for="price">Price (₱)</label>
                    <input
                        type="number"
                        id="price"
                        placeholder="e.g. 350"
                        min="0"
                        step="0.01"
                    />
                </div>

                <div class="button-group">
                    <button class="btn btn-print" id="print-btn" onclick="printLabel()">
                        🖨️ PRINT LABEL
                    </button>
                    <button class="btn btn-clear" onclick="clearForm()">
                        🗑️ CLEAR
                    </button>
                </div>

                <!-- Manual buyer override -->
                <div class="manual-section">
                    <div class="card-label">✋ MANUAL OVERRIDE</div>
                    <div class="manual-row">
                        <input
                            type="text"
                            id="manual-username"
                            placeholder="Type username manually"
                            autocomplete="off"
                        />
                        <button class="btn btn-manual" onclick="setManualBuyer()">
                            SET
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- RIGHT PANEL: Comments + Orders -->
        <div class="right-panel">

            <!-- Live Comments Card -->
            <div class="card comments-card">
                <div class="card-label">
                    💬 LIVE COMMENTS
                    <span id="comment-count"
                        style="background:#e94560;
                               color:white;
                               padding:2px 8px;
                               border-radius:10px;
                               font-size:11px">
                        0
                    </span>
                </div>
                <div class="comments-hint">
                    🟢 Green = "mine" comment → Click to set as buyer
                </div>
                <div id="comments-list">
                    <div class="empty-state">
                        Waiting for comments...<br>
                        <small style="color:#333">Make sure extension is active on TikTok</small>
                    </div>
                </div>
            </div>

            <!-- Recent Orders Card -->
            <div class="card orders-card">
                <div class="card-label">
                    📦 RECENT ORDERS
                    <button class="btn-refresh" onclick="loadOrders()">🔄</button>
                </div>
                <div id="orders-list">
                    <div class="empty-state">No orders yet</div>
                </div>
            </div>

        </div>

    </div>

    <!-- ── TOAST NOTIFICATION ── -->
    <div id="toast" class="toast hidden"></div>

    <script src="/static/app.js"></script>

</body>
</html>
